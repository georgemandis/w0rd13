<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>w0rd13</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%236aaa64'/><text x='32' y='46' font-family='Helvetica,Arial,sans-serif' font-size='40' font-weight='700' fill='white' text-anchor='middle'>1</text></svg>" />
    <script>
      try { document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("w0rd13:theme") || "classic"; } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Comic+Neue:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="brand-wrap"><button class="brand" id="home-btn" type="button" aria-label="w0rd13 home"><span class="logo" id="logo" aria-hidden="true"><span class="logo-inner"><svg class="logo-face logo-front" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="var(--green)"/><text x="32" y="46" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">1</text></svg><span class="logo-face logo-back">☝️</span></span></span>w0rd13</button></h1>
      <nav class="modes" aria-label="Game">
        <button class="mode" data-kind="clues" aria-pressed="true">Clues</button>
        <button class="mode" data-kind="orbit" aria-pressed="false">Orbit</button>
        <button class="mode mode-icon" id="trophies-btn" type="button" aria-pressed="false" aria-label="Trophy case" title="Trophy case">🏆</button>
        <div class="theme-menu" id="theme-menu">
          <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-list">
            <span class="swatch" id="theme-swatch" aria-hidden="true"></span><span id="theme-name">Classic</span><span class="caret" aria-hidden="true"></span>
          </button>
          <div class="theme-list" id="theme-list" role="menu" aria-label="Color theme" hidden></div>
        </div>
      </nav>
    </header>
    <main id="app" class="app" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
